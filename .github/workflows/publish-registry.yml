name: Publish H3 Camera Prompt Adapter v0.1.0 to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ukr8b3g-cmyk/ComfyUI-H3-Camera-Prompt-Adapter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the approved package source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 59ebed06c8fc10372a93bf8d6d66faeb3cf0f618
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the publishing CLI
        run: python -m pip install --disable-pip-version-check comfy-cli==1.22.0
      - name: Publish once and verify the public ZIP
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import tomllib
          import urllib.error
          import urllib.request
          import zipfile

          node = "comfyui-h3-camera-prompt-adapter"
          version = "0.1.0"
          publisher = "ukr8b3g-cmyk"
          source = "59ebed06c8fc10372a93bf8d6d66faeb3cf0f618"
          base = f"https://api.comfy.org/nodes/{node}"
          endpoint = f"{base}/versions/{version}"
          package_url = f"https://cdn.comfy.org/{publisher}/{node}/{version}/node.zip"

          def get_record(url, absent):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and json.load(error) == absent:
                      return None
                  raise

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          require(config["project"]["name"] == node and config["project"]["version"] == version,
                  "Unexpected node ID or version")
          require(config["tool.comfy"]["PublisherId"] == publisher
                  and config["project"]["urls"]["Repository"] == "https://github.com/ukr8b3g-cmyk/ComfyUI-H3-Camera-Prompt-Adapter",
                  "Unexpected publisher or repository")
          require(subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == source,
                  "Unexpected package source commit")
          require(not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all", "--ignored"]),
                  "Source checkout is not clean")

          files = {
              ".gitignore", "LICENSE", "README.md", "__init__.py", "pyproject.toml",
              "workflows/P3_image_MultiangleCamera.json",
          }
          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().strip("\0").split("\0"))
          require(tracked == files, "Unexpected package file set")
          require(all(Path(name).is_file() and not Path(name).is_symlink() for name in files),
                  "Package source must contain regular files")
          expected = {name: Path(name).read_bytes() for name in files}

          def verify_zip(archive_file):
              with zipfile.ZipFile(archive_file) as archive:
                  names = archive.namelist()
                  require(len(names) == len(files) and set(names) == files, "Unexpected ZIP entries")
                  require(all(archive.read(name) == expected[name] for name in names),
                          "ZIP content differs from the pinned source")

          record = get_record(endpoint, {})
          if record is None:
              token = os.environ.pop("REGISTRY_ACCESS_TOKEN", "")
              require(token, "REGISTRY_ACCESS_TOKEN is missing. No publication attempted.")
              require(get_record(base, {"error": "", "message": "Node not found"}) is None,
                      "Node ID already exists. Inspect ownership before publishing.")
              cli = ["comfy", "--skip-prompt", "--no-enable-telemetry", "node"]
              subprocess.run([*cli, "pack"], check=True)
              verify_zip("node.zip")
              Path("node.zip").unlink()
              require(get_record(endpoint, {}) is None, "Version appeared before upload. No publication attempted.")
              result = subprocess.run([*cli, "publish", "--token", token])
              require(result.returncode == 0, "Publish failed. Check Registry state before retrying.")
              for attempt in range(6):
                  record = get_record(endpoint, {})
                  if record is not None:
                      break
                  if attempt < 5:
                      time.sleep(2)
          else:
              print("Version already exists. Verifying the existing package without republishing.")

          require(record is not None, "Version not visible after upload. Check Registry state before retrying.")
          require(record["node_id"] == node and record["version"] == version
                  and record["downloadUrl"] == package_url, "Unexpected Registry version identity")
          with urllib.request.urlopen(package_url, timeout=30) as response:
              package = response.read(2_000_001)
          require(len(package) <= 2_000_000, "Unexpected public ZIP size")
          verify_zip(io.BytesIO(package))
          status = record["status"]
          print(json.dumps({"version": version, "status": status, "file_count": len(files),
                            "zip_sha256": hashlib.sha256(package).hexdigest(), "download_url": package_url}))
          require(status in ("NodeVersionStatusPending", "NodeVersionStatusActive"),
                  "Registry status needs inspection. Do not republish.")
          PY
